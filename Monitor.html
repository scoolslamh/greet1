<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>متابعة المدارس | إدارة الأمن والسلامة بعسير</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#183d37;background:#f4f8f5;line-height:1.8;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:white;border-top:5px solid #007f6d;border-bottom:1px solid #dce8e3;padding:25px max(20px,calc((100vw - 1120px)/2))}h1{font-size:24px;margin:5px 0;color:#00594e}h2{font-size:20px;margin:0 0 20px}h3{font-size:18px}main{max-width:1160px;margin:30px auto;padding:0 20px}.card{background:white;border:1px solid #dce8e3;border-radius:18px;padding:26px;margin:20px 0}.login{max-width:470px;margin:50px auto;border-top:4px solid #007f6d}label{display:block;font-weight:bold;margin-bottom:8px}input,select,button{font:inherit;border-radius:9px;min-height:48px}input,select{border:1px solid #b9cec5;padding:10px 13px;width:100%;background:white;color:inherit}button{background:#007f6d;color:white;border:1px solid transparent;padding:10px 20px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:white;border-color:#bfd4ca;color:#00594e}.login button{width:100%;margin-top:20px}:focus-visible{outline:3px solid #70b9a5;outline-offset:3px}.hidden{display:none!important}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{padding:20px;background:white;border:1px solid #dce8e3;border-radius:14px}.stat strong{display:block;font-size:30px;color:#007f6d}.stat span,.muted{color:#647973;font-size:13px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin-bottom:20px}.scroll{overflow:auto;border:1px solid #dce8e3;border-radius:12px}table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}th,td{padding:13px;border-bottom:1px solid #e0eae4;text-align:right}th{background:#edf5f0;white-space:nowrap}tr:last-child td{border:0}.badge{display:inline-block;border-radius:20px;padding:3px 10px;background:#f1f3f2;white-space:nowrap}.badge.done{color:#126140;background:#e6f5ec}progress{width:100%;accent-color:#007f6d;height:10px}.progress-cell{min-width:130px}.phone{background:#ecf5ef;color:#00594e;direction:ltr;white-space:nowrap;min-height:40px;padding:5px 10px}.notice{padding:13px 18px;background:#fff0ef;color:#972f28;border:1px solid #edc9c5;border-radius:10px}.field-error{font-size:13px;color:#a12424;margin:7px 0}.invalid{border:2px solid #b72f2f;background:#fff7f7}dialog{border:1px solid #c4d8cc;border-radius:16px;padding:26px;width:min(420px,92vw);color:inherit}dialog::backdrop{background:#12372d77}dialog a{display:block;background:#007f6d;color:white;text-decoration:none;text-align:center;padding:11px;border-radius:9px;margin:12px 0}dialog button{width:100%}.empty{padding:25px;text-align:center;color:#647973}.supervisor-filter{border:0;background:transparent;color:#006c5d;padding:0;text-decoration:underline;text-align:right}footer{text-align:center;padding:25px;font-size:12px;color:#647973}
@media(max-width:650px){main{padding:0 12px;margin-top:20px}.card{padding:20px 16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:15px}.stat strong{font-size:25px}.filters{grid-template-columns:1fr}h1{font-size:20px}.login{margin:30px auto}.toolbar .actions{width:100%}.actions button{flex:1}header{padding:20px}}
</style></head><body><header><div class="muted">إدارة الأمن والسلامة بعسير</div><h1>متابعة المدارس</h1></header><main>
<section id="login" class="card login"><h2>دخول المشرفين ومدير النظام</h2><label for="civil">السجل المدني</label><input id="civil" inputmode="numeric" maxlength="10" autocomplete="off" aria-describedby="civilError"><p id="civilError" class="field-error hidden"></p><button id="loginButton" onclick="signIn()">دخول</button></section>
<p id="notice" class="notice hidden" role="alert"></p><p id="loading" class="muted hidden" role="status">جارٍ تحميل البيانات…</p>
<section id="dashboard" class="hidden"><div class="toolbar"><div><h2 id="welcome"></h2><p id="updated" class="muted"></p></div><div class="actions"><button onclick="refresh()">تحديث</button><button class="secondary" onclick="signOut()">خروج</button></div></div><div id="stats" class="stats"></div>
<section id="manager" class="card hidden"><h2>نسبة إنجاز كل مشرف</h2><p id="unassigned" class="muted"></p><div id="supervisors" class="scroll"></div></section>
<section class="card"><h2>المدارس</h2><div class="filters"><div><label for="search">بحث</label><input id="search" placeholder="اسم المدرسة أو المدير أو المحافظة" oninput="queueSchoolSearch()"></div><div><label for="statusFilter">الحالة</label><select id="statusFilter" onchange="filterSchools()"><option value="all">الكل</option><option value="complete">مكتمل</option><option value="remaining">المتبقي</option></select></div><div id="ownerFilterWrap" class="hidden"><label for="ownerFilter">المشرف</label><select id="ownerFilter" onchange="filterSchools()"></select></div></div><p id="shown" class="muted"></p><div id="schools" class="scroll"></div><div id="schoolPages" class="toolbar hidden" style="margin-top:16px"><button class="secondary" onclick="changeSchoolPage(-1)">السابق</button><span id="schoolPageLabel" class="muted"></span><button class="secondary" onclick="changeSchoolPage(1)">التالي</button></div></section></section>
</main><footer>إدارة الأمن والسلامة بعسير</footer><dialog id="contact"><h2>التواصل مع مدير المدرسة</h2><p id="contactName"></p><a id="callLink">اتصال</a><a id="whatsappLink" target="_blank" rel="noopener noreferrer">رسالة واتساب</a><button class="secondary" onclick="document.getElementById('contact').close()">إغلاق</button></dialog>
<script>
'use strict';
let session='',model=null,pending=false,schoolPage=1,searchTimer,sessionGeneration=0;const schoolPageSize=50;
const $=id=>document.getElementById(id);
const monitorStorageKey='aseer-monitor-session-v1';
function forgetStoredSession(){try{window.localStorage.removeItem(monitorStorageKey);}catch(_){} }
function rememberSession(token){try{window.localStorage.setItem(monitorStorageKey,JSON.stringify({token,expiresAt:Date.now()+21600000}));}catch(_){} }
function readStoredSession(){
  try{const stored=JSON.parse(window.localStorage.getItem(monitorStorageKey)||'null');if(stored&&typeof stored.token==='string'&&stored.token.length>0&&stored.token.length<=200&&Number.isFinite(stored.expiresAt)&&stored.expiresAt>Date.now())return stored;forgetStoredSession();}catch(_){forgetStoredSession();}return null;
}
function clearMonitorSession(){
  sessionGeneration++;session='';model=null;schoolPage=1;clearTimeout(searchTimer);
  $('dashboard').classList.add('hidden');$('login').classList.remove('hidden');
  for(const id of ['schools','supervisors','stats','ownerFilter'])$(id).innerHTML='';
  for(const id of ['welcome','updated','contactName','shown','unassigned'])$(id).textContent='';
  $('civil').value='';$('search').value='';$('statusFilter').value='all';
  $('callLink').removeAttribute('href');$('whatsappLink').removeAttribute('href');
  if($('contact').open)$('contact').close();
}
function sessionExpired(error){return /انتهت جلسة المتابعة|لا يوجد حساب متابعة|لم تعد صلاحية المتابعة/.test(error.message||'');}
async function restoreSession(){
  const stored=readStoredSession();if(!stored)return;
  const token=stored.token;session=token;$('login').classList.add('hidden');
  await busy(async()=>{try{const result=await call('getMonitoring',token);if(session!==token)return;model=result;$('dashboard').classList.remove('hidden');render();}
    catch(error){if(session!==token)return;if(sessionExpired(error))forgetStoredSession();clearMonitorSession();throw error;}});
}
if(window.addEventListener){
  window.addEventListener('DOMContentLoaded',restoreSession);
  window.addEventListener('storage',event=>{if(event.key===monitorStorageKey&&session){const stored=readStoredSession();if(!stored||stored.token!==session){clearMonitorSession();hideNotice();}}});
}
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function hideNotice(){$('notice').textContent='';$('notice').classList.add('hidden');}
function showNotice(message,error=true){$('notice').style.background=error?'#fff0ef':'#e8f5ef';$('notice').style.color=error?'#972f28':'#145b43';$('notice').textContent=message;$('notice').classList.remove('hidden');}
function call(action,...args){if(window.google&&google.script&&google.script.run)return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[action](...args));if(!window.schoolBackend)return Promise.reject(Error('تعذر تحميل الاتصال؛ أعد تحميل الصفحة'));return window.schoolBackend.call(action,args);}
async function busy(action){if(pending)return;pending=true;hideNotice();$('loading').classList.remove('hidden');document.querySelectorAll('button').forEach(button=>button.disabled=true);try{await action();}catch(error){if(sessionExpired(error)){forgetStoredSession();clearMonitorSession();}showNotice(error.message||'تعذر تنفيذ الطلب');}finally{$('loading').classList.add('hidden');pending=false;document.querySelectorAll('button').forEach(button=>button.disabled=false);}}
function normalizeDigits(value){return String(value).replace(/[٠-٩]/g,char=>String(char.charCodeAt(0)-1632)).replace(/[۰-۹]/g,char=>String(char.charCodeAt(0)-1776)).replace(/\s/g,'');}
async function signIn(){
  const civil=normalizeDigits($('civil').value);
  if(!/^\d{10}$/.test(civil)){$('civil').classList.add('invalid');$('civil').setAttribute('aria-invalid','true');$('civilError').textContent='أدخل سجلاً مدنياً صحيحاً من 10 أرقام';$('civilError').classList.remove('hidden');$('civil').focus();return;}
  await busy(async()=>{try{const generation=sessionGeneration;const result=await call('loginSupervisor',civil);if(generation!==sessionGeneration)return;session=result.token;rememberSession(session);model=result.data;$('civil').value='';$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');render();}catch(error){$('civil').classList.add('invalid');$('civil').setAttribute('aria-invalid','true');throw error;}});
}
async function refresh(){await busy(async()=>{const token=session,result=await call('getMonitoring',token);if(session!==token)return;model=result;render();});}
async function signOut(){await busy(async()=>{const token=session;forgetStoredSession();clearMonitorSession();await call('logoutSupervisor',token);});}
function render(){
  hideNotice();const stats=model.stats,manager=model.user.role==='مدير النظام';
  $('welcome').textContent=model.user.name+' — '+model.user.role;
  $('updated').textContent='آخر تحديث: '+new Date().toLocaleString('ar-SA');
  $('stats').innerHTML=[['إجمالي المدارس',stats.total],['مكتمل',stats.complete],['المتبقي',stats.remaining],['نسبة الإنجاز',stats.percent+'٪']].map(([label,value])=>'<div class="stat"><span>'+label+'</span><strong>'+esc(value)+'</strong></div>').join('');
  $('manager').classList.toggle('hidden',!manager);$('ownerFilterWrap').classList.toggle('hidden',!manager);
  if(manager){const previous=$('ownerFilter').value;$('ownerFilter').innerHTML='<option value="all">الكل</option><option value="unassigned">غير مسندة</option>'+model.supervisors.map(item=>'<option value="'+esc(item.key)+'">'+esc(item.name)+'</option>').join('');if([...$('ownerFilter').options].some(option=>option.value===previous))$('ownerFilter').value=previous;
    $('unassigned').textContent='مدارس غير مسندة إلى حساب مشرف مسجل: '+model.unassigned.total;
    $('supervisors').innerHTML='<table><thead><tr><th>المشرف</th><th>الصلاحية</th><th>عدد المدارس</th><th>مكتمل</th><th>المتبقي</th><th>نسبة الإنجاز</th></tr></thead><tbody>'+model.supervisors.map(item=>'<tr><td>'+esc(item.name)+'</td><td>'+esc(item.role)+'</td><td>'+item.total+'</td><td>'+item.complete+'</td><td>'+item.remaining+'</td><td class="progress-cell">'+item.percent+'٪<progress max="100" value="'+item.percent+'" aria-label="'+esc(item.name)+'"></progress></td></tr>').join('')+'</tbody></table>';
  }
  drawSchools();
}
function filteredSchools(){const q=$('search').value.trim().toLowerCase(),status=$('statusFilter').value,owner=$('ownerFilter').value;return model.schools.filter(school=>(!q||[school.name,school.principal,school.governorate].some(value=>String(value).toLowerCase().includes(q)))&&(status==='all'||(status==='complete'?school.status==='مكتمل':school.status!=='مكتمل'))&&(model.user.role!=='مدير النظام'||owner==='all'||school.supervisorKey===owner));}
function queueSchoolSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(filterSchools,180);}
function filterSchools(){clearTimeout(searchTimer);schoolPage=1;drawSchools();}
function changeSchoolPage(delta){if(!model)return;const pages=Math.max(1,Math.ceil(filteredSchools().length/schoolPageSize));schoolPage=Math.max(1,Math.min(pages,schoolPage+delta));drawSchools();}
function drawSchools(){if(!model)return;hideNotice();const matches=filteredSchools(),pages=Math.max(1,Math.ceil(matches.length/schoolPageSize));schoolPage=Math.min(schoolPage,pages);const rows=matches.slice((schoolPage-1)*schoolPageSize,schoolPage*schoolPageSize);$('schoolPages').classList.toggle('hidden',matches.length<=schoolPageSize);$('schoolPageLabel').textContent='الصفحة '+schoolPage+' من '+pages;$('shown').textContent='المدارس المطابقة: '+matches.length;$('schools').innerHTML=rows.length?'<table><thead><tr><th>اسم المدرسة</th><th>اسم المدير</th><th>المحافظة</th><th>رقم الجوال</th><th>المشرف</th><th>الحالة</th>'+
(model.user.role==='مدير النظام'?'<th>إجراء</th>':'')+'</tr></thead><tbody>'+rows.map(school=>'<tr><td>'+esc(school.name)+'</td><td>'+esc(school.principal)+'</td><td>'+esc(school.governorate)+'</td><td>'+phoneButton(school)+'</td><td>'+esc(school.supervisor||'غير مسندة')+'</td><td><span class="badge '+(school.status==='مكتمل'?'done':'')+'">'+esc(school.status)+'</span></td>'+reopenCell(school)+'</tr>').join('')+'</tbody></table>':'<div class="empty">لا توجد مدارس مطابقة</div>';}
function reopenCell(school){if(model.user.role!=='مدير النظام')return '';return '<td>'+(school.status==='مكتمل'?'<button class="secondary" data-reopen="'+esc(school.id)+'">إعادة فتح للتعديل</button>':'—')+'</td>';}
async function reopenSchoolRecord(id){
  if(pending||!model||model.user.role!=='مدير النظام')return;
  const school=model.schools.find(item=>item.id===id);if(!school||school.status!=='مكتمل')return;
  if(!confirm('إعادة فتح مدرسة «'+school.name+'» للتعديل؟ ستصبح حالتها قيد الاستكمال وتحتاج اعتماداً جديداً بعد التصحيح.'))return;
  await busy(async()=>{const token=session,result=await call('reopenSchool',token,{id:school.id});if(session!==token)return;model=result;render();showNotice('تمت إعادة فتح المدرسة للتعديل؛ يمكن الدخول برقمها الوزاري وتصحيح البيانات ثم اعتمادها مجدداً.',false);});
}
function phoneNumber(value){let number=normalizeDigits(value).replace(/[+()\-]/g,'');if(/^05\d{8}$/.test(number))number='966'+number.slice(1);return /^9665\d{8}$/.test(number)?number:null;}
function phoneButton(school){return phoneNumber(school.mobile)?'<button class="phone" data-contact="'+esc(school.id)+'">'+esc(school.mobile)+'</button>':esc(school.mobile||'غير متوفر');}
function openContact(id){const school=model.schools.find(item=>item.id===id);if(!school)return;const number=phoneNumber(school.mobile);if(!number)return;$('contactName').textContent=school.principal+' — '+school.name;$('callLink').href='tel:+'+number;$('whatsappLink').href='https://wa.me/'+number;$('contact').showModal();}
$('schools').addEventListener('click',event=>{const reopen=event.target.closest('[data-reopen]');if(reopen){reopenSchoolRecord(reopen.dataset.reopen);return;}const button=event.target.closest('[data-contact]');if(button)openContact(button.dataset.contact);});
$('civil').addEventListener('input',()=>{hideNotice();$('civil').classList.remove('invalid');$('civil').removeAttribute('aria-invalid');$('civilError').classList.add('hidden');});
$('civil').addEventListener('keydown',event=>{if(event.key==='Enter')signIn();});
</script></body></html>
