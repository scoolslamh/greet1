<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#193b39;background:#f3f7f6}*{box-sizing:border-box}body{margin:0}header{background:#087b69;color:white;padding:22px;text-align:center}header h1{font-size:22px;margin:8px}.wrap{max-width:950px;margin:25px auto;padding:0 14px}.card{background:white;border-radius:14px;padding:24px;box-shadow:0 2px 12px #1232;margin:14px 0}label{display:block;margin:10px 0 5px;font-weight:bold}input,select{width:100%;padding:12px;border:1px solid #bdcdca;border-radius:8px;font:inherit;background:white}input:disabled{background:#edf1f0;color:#555}button{border:0;border-radius:8px;background:#087b69;color:white;padding:12px 20px;cursor:pointer;font:inherit;margin:8px 4px 0 0}button:disabled{opacity:.5;cursor:wait}.secondary{background:#526d69}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.muted{color:#627875}.hidden{display:none!important}.alert{padding:12px;border-radius:8px;margin:12px 0;background:#e4f4ee}.error{background:#ffe5e5;color:#962929}.step{display:inline-block;padding:8px;border-bottom:3px solid #087b69;margin:5px}.guard{border:1px solid #d6e5e1;border-radius:8px;padding:10px;margin:10px 0}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:right}th{background:#e8f2ee}.scroll{overflow:auto}@media(max-width:600px){.grid{grid-template-columns:1fr}header h1{font-size:18px}}
</style></head><body><header><div>وزارة التعليم | الإدارة العامة للتعليم بمنطقة عسير</div><h1>تحديث بيانات التغطية الأمنية لمدارس تعليم عسير</h1></header><main class="wrap"><div id="message" class="hidden alert" role="status"></div><section id="login" class="card"><h2>الدخول إلى سجل المدرسة</h2><label>الرقم الوزاري</label><input id="code" placeholder="أدخل أي رقم وزاري مرتبط بالسجل" autocomplete="off"><button onclick="sendOtp()">إرسال رمز التحقق</button><div id="otpBox" class="hidden"><label>رمز التحقق المرسل للبريد</label><input id="otp" inputmode="numeric" maxlength="6"><button onclick="login()">تحقق ودخول</button></div><p class="muted">جميع الأرقام الوزارية المرتبطة في صف واحد تفتح السجل نفسه.</p><button class="secondary" onclick="showDashboard()">لوحة المشرفين</button></section><section id="app" class="hidden"><div class="card"><h2 id="schoolTitle"></h2><div id="schoolMeta" class="muted"></div><div id="steps"></div><p id="state"></p></div><div id="content" class="card"></div><button onclick="logout()" class="secondary">خروج</button></section><section id="admin" class="card hidden"><h2>لوحة متابعة المشرفين</h2><p id="stats"></p><input id="filter" placeholder="ابحث بالمدرسة أو المحافظة أو الرقم الوزاري" oninput="drawTable()"><div id="table" class="scroll"></div><button class="secondary" onclick="hideDashboard()">رجوع</button></section></main><script>
let token='',data=null,step=0,adminData=null;const $=id=>document.getElementById(id);function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function notify(msg,error=false){$('message').textContent=msg;$('message').className='alert'+(error?' error':'');}function run(fn,...args){return new Promise((ok,no)=>{google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(Error(e.message||'تعذر تنفيذ الطلب')))[fn](...args);});}async function busy(f){try{document.querySelectorAll('button').forEach(b=>b.disabled=true);await f();}catch(e){notify(e.message,true);}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}async function sendOtp(){await busy(async()=>{const x=await run('requestCode',$('code').value);$('otpBox').classList.remove('hidden');notify(x.message+' ('+x.masked+')');});}async function login(){await busy(async()=>{const x=await run('verifyCode',$('code').value,$('otp').value);token=x.token;data=x.data;step=0;render();notify('تم تسجيل الدخول');});}function logout(){token='';data=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');}function field(label,id,val='',disabled=false,type='text'){return `<div><label>${safe(label)}</label><input id="${id}" type="${type}" value="${safe(val)}" ${disabled?'disabled':''}></div>`;}function val(id){return $(id).value.trim();}function render(){ $('login').classList.add('hidden');$('admin').classList.add('hidden');$('app').classList.remove('hidden');$('schoolTitle').textContent=data.school.name;$('schoolMeta').textContent=`الرقم الوزاري: ${data.school.code} | المحافظة: ${data.school.governorate}`;$('state').textContent='الحالة: '+data.status;$('steps').innerHTML=['بيانات المدرسة','الحراس','التغطية الأمنية','الاعتماد'].map((x,i)=>`<span class="step" style="opacity:${step===i?1:.45}">${i+1}. ${x}</span>`).join('');if(step===0)renderSchool();if(step===1)renderGuards();if(step===2)renderCoverage();if(step===3)renderApprove();}
function nav(i){step=i;render();}function renderSchool(){const s=data.school;let html='<h3>بيانات المدرسة</h3><div class="grid">';for(const [k,l] of [['code','الرقم الوزاري'],['name','اسم المدرسة'],['governorate','المحافظة'],['village','المدينة/القرية'],['stage','المرحلة'],['office','مكتب التعليم'],['gender','جنس المدرسة'],['type','نوع المدرسة']])html+=field(l,'ro_'+k,s[k],true);for(const [k,l] of [['principal','اسم مدير المدرسة'],['mobile','جوال مدير المدرسة'],['address','العنوان'],['email','البريد الإلكتروني']])html+=field(l,k,s[k]);html+='</div><button onclick="saveSchool()">حفظ والانتقال للحراس</button>';$('content').innerHTML=html;}async function saveSchool(){await busy(async()=>{data=await run('saveSchool',token,Object.fromEntries(['principal','mobile','address','email'].map(k=>[k,val(k)])));nav(1);notify('تم حفظ بيانات المدرسة');});}
function renderGuards(){const g=data.guards;$('content').innerHTML=`<h3>بيانات الحراس</h3><div class="grid">${field('عدد حراس الوزارة','ministryCount',g.ministry.length,false,'number')}${field('عدد حراس الشركة','companyCount',g.company.length,false,'number')}</div><div id="guardFields"></div><button onclick="saveGuards()">حفظ والانتقال للتغطية</button><button class="secondary" onclick="nav(0)">السابق</button>`;['ministry','company'].forEach(k=>$(k+'Count').addEventListener('change',drawGuards));drawGuards();}function drawGuards(){const old={};document.querySelectorAll('[data-guard]').forEach(e=>old[e.dataset.guard]=e.value);let html='';for(const [k,title] of [['ministry','حراس الوزارة'],['company','حراس الشركة']]){const n=Number($(k+'Count').value);if(!Number.isInteger(n)||n<0||n>50){notify('الحد المسموح من 0 إلى 50 لكل فئة',true);return;}html+=`<h4>${title}</h4>`;for(let i=0;i<n;i++){const g=data.guards[k][i]||{};html+=`<div class="guard grid">${field('اسم الحارس '+(i+1),`${k}_${i}_name`,old[`${k}_${i}_name`]??g.name??'')}${field('جوال الحارس',`${k}_${i}_mobile`,old[`${k}_${i}_mobile`]??g.mobile??'')}</div>`;}}$('guardFields').innerHTML=html;document.querySelectorAll('#guardFields input').forEach(e=>e.dataset.guard=e.id);}async function saveGuards(){await busy(async()=>{const p={};for(const k of ['ministry','company']){const n=Number($(k+'Count').value);if(!Number.isInteger(n)||n<0||n>50)throw Error('عدد الحراس غير صالح');p[k]=Array.from({length:n},(_,i)=>({name:val(`${k}_${i}_name`),mobile:val(`${k}_${i}_mobile`)}));}data=await run('saveGuards',token,p);nav(2);notify('تم حفظ بيانات الحراس');});}
const fields=[['affiliation','تبعية المدرسة','affiliation'],['classification','تصنيف المدرسة','classification'],['population','الكثافة البشرية للمدرسة','number'],['gates','عدد البوابات الإجمالي','number'],['usedGates','البوابات المستخدمة للدخول والخروج','number'],['coverageType','نوع التغطية','coverageType'],['coverageRange','مدى التغطية','coverageRange'],['required','إجمالي أفراد التغطية اللازم','number'],['risk','خطورة المدرسة','risk']];function renderCoverage(){const c=data.coverage||[],indexes=[3,4,5,6,7,8,9,11,14];let html='<h3>بيانات التغطية الأمنية</h3><div class="grid">';fields.forEach(([k,label,type],i)=>{const value=c[indexes[i]]??'';if(type==='number')html+=field(label,k,value,false,'number');else html+=`<div><label>${label}</label><select id="${k}"><option value="">اختر</option>${data.options[type].map(v=>`<option value="${safe(v)}" ${v===value?'selected':''}>${safe(v)}</option>`).join('')}</select></div>`;});html+='</div><p class="muted">عدد الحراس الحالي يُحسب تلقائياً من المرحلة السابقة. الفائض والعجز يُحسبان آلياً.</p><button onclick="saveCoverage()">حفظ والانتقال للاعتماد</button><button class="secondary" onclick="nav(1)">السابق</button>';$('content').innerHTML=html;}async function saveCoverage(){await busy(async()=>{data=await run('saveCoverage',token,Object.fromEntries(fields.map(([k])=>[k,val(k)])));nav(3);notify('تم حفظ بيانات التغطية');});}
function renderApprove(){const done=data.status==='مكتمل';$('content').innerHTML=`<h3>المراجعة والاعتماد</h3><p>المدرسة: ${safe(data.school.name)}</p><p>حراس الوزارة: ${data.guards.ministry.length} | حراس الشركة: ${data.guards.company.length}</p><p>حالة السجل: <strong>${safe(data.status)}</strong></p>${done?'<p class="alert">تم اعتماد البيانات بنجاح. الحالة: مكتمل</p>':'<button onclick="approve()">اعتماد البيانات نهائياً</button>'}<button class="secondary" onclick="nav(2)">السابق</button>`;}async function approve(){if(!confirm('هل تؤكد اعتماد البيانات؟ لن يمكن تعديلها بعد الاعتماد إلا من المشرف.'))return;await busy(async()=>{data=await run('approve',token);render();notify('تم الاعتماد بنجاح');});}
async function showDashboard(){await busy(async()=>{adminData=await run('dashboard');$('login').classList.add('hidden');$('app').classList.add('hidden');$('admin').classList.remove('hidden');$('stats').textContent=`إجمالي السجلات: ${adminData.total} | مكتمل: ${adminData.complete} | المتبقي: ${adminData.total-adminData.complete}`;drawTable();});}function hideDashboard(){$('admin').classList.add('hidden');$('login').classList.remove('hidden');}function drawTable(){if(!adminData)return;const q=$('filter').value.trim().toLowerCase();const rows=adminData.schools.filter(r=>[r.code,r.name,r.governorate,r.status].some(x=>String(x).toLowerCase().includes(q)));$('table').innerHTML='<table><tr><th>المدرسة</th><th>الرقم الوزاري</th><th>المحافظة</th><th>الحالة</th><th>إجراء</th></tr>'+rows.map(r=>`<tr><td>${safe(r.name)}</td><td>${safe(r.code)}</td><td>${safe(r.governorate)}</td><td>${safe(r.status)}</td><td>${r.status==='مكتمل'?`<button class="secondary" onclick="reopenRecord('${safe(r.id)}')">إعادة فتح</button>`:''}</td></tr>`).join('')+'</table>';}async function reopenRecord(id){if(!confirm('إعادة فتح السجل للتعديل؟'))return;await busy(async()=>{adminData=await run('reopen',id);drawTable();notify('تمت إعادة فتح السجل');});}
</script></body></html>
